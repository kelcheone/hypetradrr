[project]
name = "trade-simulation"
version = "0.1.0"
description = "BTC leveraged paper-trading experiment"
readme = "README.md"
authors = [
    { name = "Kevin Kelche", email = "kelcheone@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.35,<1",
    "websockets>=15,<17",
]

[project.scripts]
trade-simulation = "trade_simulation.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
